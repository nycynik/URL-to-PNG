[project]
name = "url-to-png"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=24.4.2",
    "colorama>=0.4.6",
    "flake8>=7.1.0",
    "isort>=5.13.2",
    "mypy>=1.10.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "scikit-image>=0.21.0",
    "selenium>=4.31.0",
    "webdriver-manager>=4.0.2",
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "venv"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = true
warn_unused_configs = true
